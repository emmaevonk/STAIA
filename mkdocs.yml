site_name: STAIA

# themes: https://pawamoy.github.io/mkdocs-gallery/
# original: material
theme: # flatly
  name: readthedocs 

plugins:
  - search
  - mkdocs-jupyter 
  - mkdocstrings:
      handlers:
        python:
          options:
            show_submodules: false
            filters:
              - "!^_"
            show_source: true
            docstring_style: numpy

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Tutorials:
      - Tutorial: tutorials/tutorial.ipynb
  - Documentation: 
      - Read Data: documentation/read_spatialobject.md
      - Add Nuclei: documentation/add_nuclei.md
      - QC: documentation/qc.md
      - Size Normalization: documentation/size_normalization.md
      - Batch Correction: documentation/batch_correction.md
      - Annotation: documentation/annotation.md
      - Assigning Labels: documentation/assigning_labels.md
      - Compute Metrics: documentation/metrics.md
      - Adjusted Rand Index: documentation/ari.md
      - Segmentation: documentation/segmentation.md
      - Neighbor Analysis: documentation/neighbor_analysis.md
      - Spatial Clustering: documentation/spatial_clustering.md
      - Spatially Variable Genes: documentation/svg.md
      - Ligand-Receptor: documentation/lr.md
      - Pseudobulk DE: documentation/pseudobulk.md
      - Plotting: documentation/plot.md
