[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "staia"
version = "0.1.0"
description = "A functional API for spatial transcriptomics analysis of Xenium data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "==3.11.*"
authors = [
  { name = "Your Name", email = "your@email.com" }
]
keywords = ["spatial transcriptomics", "xenium", "bioinformatics", "single-cell"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Core dependencies shared by both CPU and GPU installs
# torch, torch_scatter, torch_sparse, and pybanksy are excluded here
# because they require special index URLs — see install scripts below
dependencies = [
  "matplotlib==3.10.9",
  "numpy",
  "pandas==2.3.3",
  "scipy==1.17.1",
  "scikit-image==0.26.0",
  "anndata==0.12.13",
  "ipywidgets==8.1.8",
  "IPython",
  "scanpy==1.11.5",
  "spatialdata==0.6.1",
  "setuptools==81.0.0",
  "xarray==2026.1.0",
  "squidpy==1.7.0",
  "scvi-tools==1.4.2",
  "cellcharter==0.3.7",
  "lightning==2.6.1",
  "seaborn==0.13.2",
  "spatialdata-plot==0.2.14",
  "celltypist",
  "tangram-sc",
  "shapely==2.1.2",
  "geopandas==1.1.2",
  "pydeseq2==0.5.4",
  "scikit-learn<1.7",
  "igraph",
  "leidenalg",
  "spatialdata-io==0.6.0",
  "ipympl",
  "nichecompass",
]

[project.optional-dependencies]
# Install with: pip install staia[cpu]
# Then run: pip install torch==2.6.0+cpu torch_scatter torch_sparse --extra-index-url https://download.pytorch.org/whl/cpu -f https://data.pyg.org/whl/torch-2.6.0+cpu.html
# Then run: pip install "pybanksy[notebooks]"
cpu = [
  "torch==2.6.0",   # placeholder — actual install needs the index URL (see above)
]

# Install with: pip install staia[gpu]
# Then run: pip install torch==2.6.0 torch_scatter torch_sparse --extra-index-url https://download.pytorch.org/whl/cu126 -f https://data.pyg.org/whl/torch-2.6.0+cu126.html
# Then run: pip install "pybanksy[notebooks]"
gpu = [
  "torch==2.6.0",   # placeholder — actual install needs the index URL (see above)
]

[project.urls]
Homepage = "https://emmaevonk.github.io/STAIA/"
Repository = "https://github.com/emmaevonk/STAIA"
Documentation = "https://emmaevonk.github.io/STAIA/"